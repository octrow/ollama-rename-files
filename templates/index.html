<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Renamer</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main id="app">
    <h1>File Renamer</h1>

    <section>
        <label for="directory">Directory</label>
        <div class="row">
            <input type="text" id="directory" placeholder="/path/to/folder">
            <button id="choose-dir-btn" type="button" class="secondary">Browse…</button>
            <button id="set-dir-btn" type="button">Scan</button>
        </div>
    </section>

    <section id="patterns-section" hidden>
        <h2>Pattern</h2>
        <div id="patterns"></div>
        <div class="row">
            <input type="text" id="prefix" placeholder="prefix" aria-label="File prefix">
            <input type="text" id="extension" placeholder=".txt" aria-label="File extension">
        </div>
    </section>

    <section>
        <label for="model">Model</label>
        <select id="model"></select>
    </section>

    <button id="rename-btn" type="button">Rename files</button>
    <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="/static/script.js"></script>
</body>
</html>
