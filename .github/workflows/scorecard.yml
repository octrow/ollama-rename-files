# Copy to <repo>/.github/workflows/scorecard.yml (public repos). Results land in Security → Code scanning
# and on https://scorecard.dev; badge for the README:
# [![OpenSSF Scorecard](https://api.scorecard.dev/projects/github.com/OWNER/REPO/badge)](https://scorecard.dev/viewer/?uri=github.com/OWNER/REPO)
# scorecard-action rejects workflows with top-level env/defaults or extra write permissions; keep this shape.
name: scorecard
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF
      id-token: write          # publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
