# Tag vX.Y.Z → tests → wheel, sdist and PyInstaller builds → GitHub release with every file attested.
# A push to main that changes this file builds everything as a dry run and publishes nothing.
# PyPI is off until a trusted publisher is set up (PyPI → Publishing → pending publisher: owner octrow,
# repo ollama-rename-files, workflow release.yml, environment pypi); then uncomment the pypi job.
name: release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false  # no cache in a release workflow: a poisoned cache would ship in the artifacts
      - name: tag must match the pyproject version (the installers derive the wheel name from the tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv sync --locked && uv run pytest -q

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Optional: standalone builds, unpack and run with no Python or uv. Worth it for GUI and heavy apps.
  binaries:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, platform: linux-x86_64}  # oldest supported glibc for the widest Linux reach
          - {os: ubuntu-22.04-arm, platform: linux-arm64}
          - {os: macos-latest, platform: macos-arm64}
          - {os: windows-latest, platform: windows-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: |
          uv run --locked --python 3.12 --with "pyinstaller>=6.10,<7" pyinstaller --noconfirm --name ollama-rename \
            --paths src --collect-data ollama_rename_files --collect-all webview src/ollama_rename_files/__main__.py
      - name: smoke test
        run: dist/ollama-rename/ollama-rename --help
      - name: archive
        run: |
          name="ollama-rename-$(uv version --short)-$PLATFORM"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "../$name.zip" ollama-rename; else tar -czf "../$name.tar.gz" ollama-rename; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.platform }}
          path: ollama-rename-*.*

  # Optional: uncomment once the PyPI trusted publisher exists.
  # pypi:
  #   needs: [build, binaries]  # publish nothing unless every build passed
  #   if: startsWith(github.ref, 'refs/tags/')
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   environment: pypi
  #   permissions:
  #     id-token: write      # trusted publishing (OIDC) and PEP 740 attestations
  #   steps:
  #     - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
  #       with:
  #         name: dist
  #         path: dist/
  #     - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true
      # GitHub stores attestations only for public repos (or orgs with a paid plan); a private personal repo
      # would fail the release here, so it skips the step until the visibility flip
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
